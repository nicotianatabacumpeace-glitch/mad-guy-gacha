<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>マドガイ記事ガチャ</title>
<style>
:root {
  --bg-1:#06170d;
  --bg-2:#0d3a1d;
  --panel:#0b2413;
  --green:#65ff79;
  --green-soft:#caffd1;
  --text:#f6fff8;
  --muted:#a8cdb0;
}
* { box-sizing:border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
body {
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 52%, rgba(48,255,94,.12), transparent 34%),
    radial-gradient(circle at 50% -10%, #17652f 0, var(--bg-2) 28%, var(--bg-1) 72%);
}
button, a { font:inherit; }

.app {
  width:100%;
  height:100%;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto;
  gap:8px;
  padding:12px 20px 10px;
}

.header {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  min-height:64px;
}
.logo {
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));
}
h1 {
  margin:0;
  font-size:clamp(27px,4vw,48px);
  line-height:1;
  color:#e8ffed;
  text-shadow:0 0 18px rgba(76,255,112,.48);
}
.subtitle {
  margin:5px 0 0;
  text-align:center;
  font-size:13px;
  color:var(--green-soft);
}
.header-copy { text-align:center; }

.toolbar {
  position:relative;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}
.buttons {
  display:flex;
  gap:10px;
}
.gacha-button {
  min-width:132px;
  padding:10px 20px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:999px;
  font-weight:1000;
  font-size:16px;
  cursor:pointer;
  color:#09130b;
  background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.32);
  transition:transform .14s ease, filter .14s ease;
}
.gacha-button.five {
  border-color:#aaff98;
  background:linear-gradient(180deg,#a2ff82,#62ec54);
}
.gacha-button:hover { transform:translateY(-1px); filter:brightness(1.05); }
.gacha-button:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.stats {
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
  text-align:center;
}

.stage {
  position:relative;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.stage-inner {
  width:min(1180px,96vw);
  height:100%;
  min-height:0;
  position:relative;
}

.pack {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(270px,27vh);
  aspect-ratio:2 / 3;
  border-radius:22px;
  display:grid;
  place-items:center;
  text-align:center;
  color:#f2fff4;
  font-weight:1000;
  font-size:clamp(19px,2.2vw,29px);
  line-height:1.15;
  letter-spacing:.07em;
  background:
    linear-gradient(135deg,rgba(255,255,255,.18) 0 12%,transparent 12% 24%,rgba(255,255,255,.08) 24% 34%,transparent 34%),
    linear-gradient(160deg,#27b44e,#116b30 58%,#082b16);
  border:4px solid #98ffa8;
  box-shadow:
    0 20px 50px rgba(0,0,0,.55),
    inset 0 0 30px rgba(255,255,255,.12);
  position:relative;
  z-index:4;
}
.pack::before, .mini-pack::before {
  content:"";
  position:absolute;
  left:0; right:0; top:25px;
  height:13px;
  background:repeating-linear-gradient(90deg,#d8ffe0 0 9px,#4b9b5d 9px 18px);
  box-shadow:0 calc(100% + 250px) 0 rgba(210,255,220,.55);
}
.pack.shake { animation:shake .75s ease-in-out; }
.pack.float { animation:float .9s ease-in-out infinite alternate; }
.pack.heavy { animation:heavy 1.05s ease-in-out infinite; }
.pack.open { animation:burst .62s ease forwards; }

.single-shell {
  width:min(760px,78vw);
  height:min(420px,54vh);
  max-height:54vh;
  position:absolute;
  left:50%;
  top:50%;
  z-index:3;
  opacity:0;
  transform:translate(-50%,-50%) scale(.88);
}
.single-shell.show { animation:rise .72s cubic-bezier(.18,.9,.25,1.15) forwards; }

.result-card {
  position:relative;
  z-index:3;
  overflow:hidden;
  border-radius:22px;
  background:linear-gradient(145deg,#102d1a,#07160d);
  border:4px solid var(--rarity);
  box-shadow:
    0 18px 48px rgba(0,0,0,.55),
    0 0 14px color-mix(in srgb, var(--rarity) 45%, transparent);
}
.single-card {
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(250px,.9fr);
  width:100%;
  height:100%;
  min-height:0;
}
.single-card .thumb {
  width:100%;
  height:100%;
  min-height:0;
  max-height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.card-copy {
  padding:22px;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  min-width:0;
  min-height:0;
  overflow:hidden;
}
.rarity {
  color:var(--rarity);
  font-size:40px;
  font-weight:1000;
  line-height:1;
  text-shadow:0 0 16px color-mix(in srgb, var(--rarity) 70%, transparent);
}
.label {
  margin-top:7px;
  font-size:21px;
  font-weight:1000;
}
.title {
  margin-top:18px;
  font-size:clamp(17px,2vw,24px);
  font-weight:900;
  line-height:1.45;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
}
.read {
  flex:0 0 auto;
  margin-top:auto;
  padding:12px 16px;
  border:1px solid color-mix(in srgb, var(--rarity) 75%, white);
  border-radius:11px;
  color:#0a170d;
  background:#f8fff9;
  text-align:center;
  text-decoration:none;
  font-weight:1000;
}

.aura {
  position:absolute;
  left:50%;
  top:50%;
  width:min(820px,76vw);
  aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.2);
  border-radius:50%;
  opacity:0;
  filter:blur(32px);
  pointer-events:none;
  z-index:1;
}
.aura.play {
  background:var(--aura);
  animation:aura 1.35s ease-out forwards;
}

.five-grid {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  align-items:center;
}
.slot {
  min-width:0;
  height:min(55vh,480px);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.slot-aura {
  position:absolute;
  left:50%;
  top:50%;
  width:115%;
  aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.18);
  border-radius:50%;
  filter:blur(23px);
  opacity:0;
  z-index:0;
  pointer-events:none;
}
.slot-aura.play { display:none; }
.mini-pack {
  width:min(142px,12vw);
  aspect-ratio:2 / 3;
  position:absolute;
  z-index:4;
  display:grid;
  place-items:center;
  text-align:center;
  color:white;
  font-weight:1000;
  font-size:clamp(10px,1vw,15px);
  line-height:1.15;
  letter-spacing:.04em;
  border:3px solid #98ffa8;
  border-radius:15px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.18) 0 12%,transparent 12% 24%,rgba(255,255,255,.08) 24% 34%,transparent 34%),
    linear-gradient(160deg,#27b44e,#116b30 58%,#082b16);
  box-shadow:0 14px 35px rgba(0,0,0,.5);
}
.mini-pack::before { top:15px; height:8px; box-shadow:none; }
.mini-pack.open { animation:burst .56s ease forwards; }
.mini-pack.shake { animation:shake .7s ease-in-out; }
.mini-pack.heavy { animation:heavy 1s ease-in-out infinite; }

.mini-card {
  width:100%;
  height:100%;
  max-height:430px;
  display:flex;
  flex-direction:column;
  opacity:0;
  transform:scale(.88);
}
.mini-card.show { opacity:1; transform:scale(1); }
.mini-card .thumb {
  width:100%;
  height:min(21vh,180px);
  object-fit:cover;
}
.mini-card .card-copy {
  padding:11px;
  flex:1;
  justify-content:flex-start;
}
.mini-card .rarity { font-size:26px; }
.mini-card .label { margin-top:3px; font-size:13px; }
.mini-card .title {
  margin-top:8px;
  font-size:12px;
  line-height:1.35;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
}
.mini-card .read {
  flex:0 0 auto;
  margin-top:auto;
  padding:8px 5px;
  font-size:11px;
}
.summary {
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  font-weight:900;
  color:#dcffe2;
  white-space:nowrap;
}

.footer {
  min-height:18px;
  text-align:center;
  color:#8dbd98;
  font-size:10px;
}

@keyframes shake {
  0%,100% { transform:translate(-50%,-50%) rotate(0); }
  20% { transform:translate(-50%,-50%) rotate(-4deg); }
  40% { transform:translate(-50%,-50%) rotate(4deg); }
  60% { transform:translate(-50%,-50%) rotate(-3deg); }
  80% { transform:translate(-50%,-50%) rotate(3deg); }
}
@keyframes heavy {
  0%,100% { transform:translate(-50%,-50%) rotate(0); }
  15% { transform:translate(calc(-50% - 6px),calc(-50% + 2px)) rotate(-5deg); }
  30% { transform:translate(calc(-50% + 7px),calc(-50% - 2px)) rotate(5deg); }
  45% { transform:translate(calc(-50% - 8px),calc(-50% + 2px)) rotate(-6deg); }
  60% { transform:translate(calc(-50% + 8px),calc(-50% - 2px)) rotate(6deg); }
  75% { transform:translate(calc(-50% - 5px),calc(-50% + 1px)) rotate(-3deg); }
}
@keyframes float {
  from { transform:translate(-50%,-50%); }
  to { transform:translate(-50%,calc(-50% - 16px)); }
}
@keyframes burst {
  to { opacity:0; transform:translate(-50%,-50%) scale(1.18); filter:blur(8px); }
}
@keyframes rise {
  0% { opacity:0; transform:translate(-50%,-50%) scale(.88); }
  70% { opacity:1; transform:translate(-50%,-50%) scale(1.015); }
  100% { opacity:1; transform:translate(-50%,-50%) scale(1); }
}
@keyframes miniRise {
  0% { opacity:0; transform:scale(.88); }
  70% { opacity:1; transform:scale(1.015); }
  100% { opacity:1; transform:scale(1); }
}
@keyframes aura {
  0% { opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(0); }
  45% { opacity:.9; }
  100% { opacity:0; transform:translate(-50%,-50%) scale(1.7) rotate(270deg); }
}

@media (max-width:850px) {
  .app { padding-inline:8px; }
  .header { gap:8px; min-height:48px; }
  .logo { width:42px; height:42px; }
  h1 { font-size:25px; }
  .subtitle { display:none; }
  .gacha-button { min-width:112px; padding:8px 14px; font-size:14px; }
  .stats { font-size:9px; }
  .single-shell { width:min(700px,94vw); }
  .single-shell { height:min(360px,52vh); }
  .single-card { grid-template-columns:1fr 1fr; min-height:0; }
  .single-card .thumb { min-height:0; }
  .card-copy { padding:14px; }
  .rarity { font-size:31px; }
  .label { font-size:16px; }
  .title { margin-top:10px; font-size:14px; }
  .five-grid { gap:4px; }
  .slot { height:52vh; }
  .mini-card .thumb { height:14vh; }
  .mini-card .card-copy { padding:6px; }
  .mini-card .rarity { font-size:18px; }
  .mini-card .label { font-size:9px; }
  .mini-card .title { font-size:9px; -webkit-line-clamp:2; }
  .mini-card .read { padding:5px 2px; font-size:8px; }
  .summary { font-size:11px; }
}

@media (max-height:680px) {
  .app { padding-block:7px; gap:3px; }
  .header { min-height:42px; }
  .logo { width:40px; height:40px; }
  h1 { font-size:26px; }
  .stats { line-height:1.2; }
  .single-shell { height:min(320px,50vh); max-height:50vh; }
  .single-card { min-height:0; }
  .single-card .thumb { min-height:0; }
  .slot { height:49vh; }
}

.single-card .thumb{
  overflow:hidden;
}
@media(max-width:620px){
  .single-shell{
    width:min(94vw,620px);
    height:min(330px,50vh);
  }
  .single-card{
    grid-template-columns:1.05fr .95fr;
  }
  .card-copy{padding:12px}
  .rarity{font-size:28px}
  .label{font-size:15px}
  .title{
    margin-top:9px;
    font-size:13px;
    -webkit-line-clamp:3;
  }
  .read{
    padding:9px 8px;
    font-size:12px;
  }
}

</style>
</head>

const rarityStyle = {
  SSR: { color:"#ffe55b", aura:"conic-gradient(#ff5151,#ffe35a,#62ff73,#55e8ff,#7d69ff,#ff5bd2,#ff5151)", delay:3300 },
  SR:  { color:"#ff67d2", aura:"#ff67d2", delay:1900 },
  R:   { color:"#58b6ff", aura:"#58b6ff", delay:1000 },
  N:   { color:"#b7c7ba", aura:"#b7c7ba", delay:450 }
};
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
let busy = false;

const stage = document.getElementById("stage");
const singleButton = document.getElementById("singleButton");
const fiveButton = document.getElementById("fiveButton");

function setBusy(value) {
  busy = value;
  singleButton.disabled = value;
  fiveButton.disabled = value;
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[char]);
}

function makeSingleCard(article) {
  const style = rarityStyle[article.rarity];
  return `
    <div class="single-shell" id="singleShell">
      <article class="result-card single-card" style="--rarity:${style.color}">
        <img class="thumb" src="${article.thumbnail}" alt="">
        <div class="card-copy">
          <div class="rarity">${article.rarity}</div>
          <div class="label">${article.label}</div>
          <div class="title">${esc(article.title)}</div>
          <a class="read" href="${article.url}" target="_blank" rel="noopener">記事を読む →</a>
        </div>
      </article>
    </div>`;
}

function makeMiniCard(article) {
  const style = rarityStyle[article.rarity];
  return `
    <article class="result-card mini-card" style="--rarity:${style.color}">
      <img class="thumb" src="${article.thumbnail}" alt="">
      <div class="card-copy">
        <div class="rarity">${article.rarity}</div>
        <div class="label">${article.label}</div>
        <div class="title">${esc(article.title)}</div>
        <a class="read" href="${article.url}" target="_blank" rel="noopener">記事を読む →</a>
      </div>
    </article>`;
}

async function playPack(pack, article) {
  const rarity = article.rarity;
  if (rarity === "R") {
    pack.classList.add("shake");
  }
  if (rarity === "SR") {
    pack.classList.add("shake");
    await wait(700);
    pack.classList.remove("shake");
    pack.classList.add("float");
  }
  if (rarity === "SSR") {
    pack.classList.add("shake");
    await wait(700);
    pack.classList.remove("shake");
    pack.classList.add("float");
    await wait(700);
    pack.classList.remove("float");
    pack.classList.add("heavy");
  }
  await wait(Math.max(0, rarityStyle[rarity].delay - (rarity === "SSR" ? 1400 : rarity === "SR" ? 700 : 0)));
}

  setBusy(true);

  const article = articles[Math.floor(Math.random() * articles.length)];
  const style = rarityStyle[article.rarity];

  stage.innerHTML = `
    <div class="aura" id="singleAura" style="--aura:${style.aura}"></div>
    <div class="pack" id="singlePack">MAD GUY<br>ARTICLE PACK</div>`;

  const pack = document.getElementById("singlePack");
  await playPack(pack, article);

  pack.classList.add("open");
  document.getElementById("singleAura").classList.add("play");
  stage.insertAdjacentHTML("beforeend", makeSingleCard(article));

  requestAnimationFrame(() => document.getElementById("singleShell").classList.add("show"));
  await wait(850);
  pack.remove();
  setBusy(false);
}

function sampleUnique(count) {
  const pool = [...articles];
  const result = [];
  while (result.length < count && pool.length) {
    result.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return result;
}

async function drawFive() {
  if (busy) return;
  setBusy(true);

  const picks = sampleUnique(5);
  stage.innerHTML = `
    <div class="five-grid">
      ${picks.map((article, index) => {
        const style = rarityStyle[article.rarity];
        return `
          <div class="slot" id="slot${index}">
            <div class="slot-aura" id="aura${index}" style="--aura:${style.aura}"></div>
            <div class="mini-pack" id="pack${index}">MAD GUY<br>ARTICLE PACK</div>
          </div>`;
      }).join("")}
    </div>
    <div class="summary" id="summary"></div>`;

  await Promise.all(picks.map(async (article, index) => {
    const pack = document.getElementById(`pack${index}`);
    const slot = document.getElementById(`slot${index}`);
    await wait(250);

    pack.classList.add("open");
    slot.insertAdjacentHTML("beforeend", makeMiniCard(article));
    requestAnimationFrame(() => slot.querySelector(".mini-card").classList.add("show"));

    await wait(750);
    pack.remove();
  }));

  const result = { SSR:0, SR:0, R:0, N:0 };
  picks.forEach(article => result[article.rarity]++);
  document.getElementById("summary").textContent =
    `結果：SSR ${result.SSR}枚 / SR ${result.SR}枚 / R ${result.R}枚 / N ${result.N}枚`;

  setBusy(false);
}

singleButton.addEventListener("click", drawSingle);
fiveButton.addEventListener("click", drawFive);
</script>
</body>
